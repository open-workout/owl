name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  reference-go:
    name: Build reference/ + validate conformance fixtures
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: gofmt -l . | tee /tmp/fmt.out && test ! -s /tmp/fmt.out
      - run: go vet ./...
      - run: go build ./...
      - run: go run ./cmd/owlc validate-fixtures ..
      - run: go test ./...
      # go test runs Compile against every conformance/parse/* fixture
      # (compile_test.go) and diffs the result against expected.json as
      # Go values — the real correctness check validate-fixtures alone
      # can't do (it only checks fixtures are structurally well-formed,
      # not that they're what a real implementation produces). Keeping
      # both: validate-fixtures catches a malformed fixture, go test
      # catches a wrong implementation.
      # TODO: once Resolve/Progress are implemented, extend go test's
      # coverage to conformance/{resolve,progress}/ the same way.
