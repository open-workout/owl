name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  reference-go:
    name: Build reference/ + validate conformance fixtures
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: gofmt -l . | tee /tmp/fmt.out && test ! -s /tmp/fmt.out
      - run: go vet ./...
      - run: go build ./...
      - run: go run ./cmd/owlc validate-fixtures ..
      # TODO: once Compile/Resolve/Progress are implemented, replace the
      # validate-fixtures step above with a job that actually runs them
      # against every conformance/{parse,resolve,progress}/ fixture and
      # diffs the result against expected.json — validate-fixtures only
      # checks the fixtures are structurally well-formed against the
      # schemas in spec/ and conformance/schema/, not that they're the
      # correct output of a real implementation.
